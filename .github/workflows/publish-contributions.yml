name: Publish Approved 22 Code Store Contributions

on:
  push:
    branches:
      - main
    paths:
      - "contributions/**"

permissions:
  contents: write

jobs:
  publish:
    # This privileged workflow runs only after a reviewed contribution reaches main.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Safely stage approved ZIP submissions
        run: python tools/validate_contribution_zips.py --extract

      - name: Validate Store registry and staged contributions
        run: python tools/validate_store.py

      - name: Publish contributions
        run: python tools/publish_contributions.py

      - name: Commit generated Store files
        run: |
          if git diff --quiet; then
            echo "No publication changes."
            exit 0
          fi
          git config user.name "22 Code Store Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libraries scripts registry
          git commit -m "Publish approved Store contributions"
          git push
