name: Validate 22 Store

on:
  push:
    paths:
      - "registry/**"
      - "libraries/**"
      - "scripts/**"
      - "contributions/**"
      - "tools/**"
      - "CONTRIBUTING.md"
  pull_request:
    paths:
      - "registry/**"
      - "libraries/**"
      - "scripts/**"
      - "contributions/**"
      - "tools/**"
      - "CONTRIBUTING.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Store
        run: python tools/validate_store.py
